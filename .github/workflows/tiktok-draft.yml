name: Publish slideshow to TikTok

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      accounts:
        description: 'Comma-separated account slugs (default: the TIKTOK_ACCOUNTS variable)'
        required: false
        type: string
      direct:
        description: 'Publish straight to the feed instead of a draft'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tiktok-publish
  cancel-in-progress: false

jobs:
  # One job builds every account's deck, because the decks have to be checked
  # against each other for a repeated title and they all ship in a single Pages
  # deployment. Posting then fans out, one leg per account.
  build:
    runs-on: ubuntu-latest
    # Actions cannot index the secrets context by a name built at runtime, and
    # toJSON(secrets) -- the usual workaround -- makes GitHub refuse to start the
    # run at all (action_required, no jobs, no logs). So every account's token is
    # bound explicitly here and selected in bash by indirect expansion. A secret
    # that does not exist expands to "", which is exactly the "has this account
    # been authorised yet?" test. Adding an account means adding a line here.
    env:
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_REFRESH_TOKEN_AISTARTUPFOUNDER: ${{ secrets.TIKTOK_REFRESH_TOKEN_AISTARTUPFOUNDER }}
      TIKTOK_REFRESH_TOKEN_AITOOLS_GUY: ${{ secrets.TIKTOK_REFRESH_TOKEN_AITOOLS_GUY }}
      TIKTOK_REFRESH_TOKEN_STARTUPTOOLS101: ${{ secrets.TIKTOK_REFRESH_TOKEN_STARTUPTOOLS101 }}
      TIKTOK_REFRESH_TOKEN_TYLER_AI: ${{ secrets.TIKTOK_REFRESH_TOKEN_TYLER_AI }}
      TIKTOK_REFRESH_TOKEN_SOLOPRENEURTIPS: ${{ secrets.TIKTOK_REFRESH_TOKEN_SOLOPRENEURTIPS }}
      TIKTOK_REFRESH_TOKEN_STARTUPFOUNDERTIPS: ${{ secrets.TIKTOK_REFRESH_TOKEN_STARTUPFOUNDERTIPS }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      accounts: ${{ steps.roster.outputs.accounts }}
      stamp: ${{ steps.roster.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --upgrade Pillow higgsfield-client

      - name: Work out which accounts have a usable token
        id: roster
        env:
          REQUESTED: ${{ inputs.accounts || vars.TIKTOK_ACCOUNTS }}
          LEGACY: ${{ vars.TIKTOK_LEGACY_ACCOUNT }}
        run: |
          set -euo pipefail
          REQUESTED="${REQUESTED:-main}"
          KEPT=(); SKIPPED=()
          for SLUG in $(echo "$REQUESTED" | tr ',' ' '); do
            UPPER=$(echo "$SLUG" | tr '[:lower:]' '[:upper:]' | tr -c 'A-Z0-9_\n' '_')
            VAR="TIKTOK_REFRESH_TOKEN_${UPPER}"
            HAVE="${!VAR:-}"
            if [ -z "$HAVE" ] && [ "$SLUG" = "${LEGACY:-}" ]; then HAVE="${TIKTOK_REFRESH_TOKEN:-}"; fi
            if [ -n "$HAVE" ]; then KEPT+=("$SLUG"); else SKIPPED+=("$SLUG"); fi
          done
          if [ ${#SKIPPED[@]} -gt 0 ]; then
            echo "::warning title=Accounts without a refresh token::Skipped: ${SKIPPED[*]}. Run scripts/tiktok_auth.py signed in as each one and store TIKTOK_REFRESH_TOKEN_<SLUG>."
          fi
          if [ ${#KEPT[@]} -eq 0 ]; then
            echo "::error::No account in '$REQUESTED' has a refresh token."; exit 1
          fi
          printf 'accounts=%s\n' "$(printf '%s\n' "${KEPT[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          printf 'stamp=%s\n' "$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "Building for: ${KEPT[*]}"

      - name: Build one distinct deck per account
        env:
          WITH_SLIDEYS: '1'
          HF_KEY: ${{ secrets.HF_KEY }}
          ACCOUNTS: ${{ steps.roster.outputs.accounts }}
          STAMP: ${{ steps.roster.outputs.stamp }}
        run: |
          set -euo pipefail
          # The copy bank holds a fixed number of opening titles. Asking for a
          # unique title per account is unsatisfiable once there are more
          # accounts than titles, so only insist on a fresh one while an unused
          # title still exists -- after that, repeats are allowed rather than
          # burning attempts on an impossible constraint.
          POOL=$(python3 -c "import json;print(len(json.load(open('assets/copy_bank.json'))['slideshow_title']))")
          echo "distinct opening titles available: $POOL"
          USED=""; DISTINCT=0
          for SLUG in $(echo "$ACCOUNTS" | jq -r '.[]'); do
            for ATTEMPT in 1 2 3 4 5 6 7 8; do
              rm -rf runs
              # Each attempt redraws the title slide too, so the accounts differ
              # in the opening frame as well as the five apps and the caption.
              python3 scripts/refresh_title_slide.py
              python3 scripts/make_slideshow.py > /dev/null
              DIR="runs/$(ls -1 runs | sort -r | head -n1)"
              TITLE=$(sed -n 's/^TITLE: //p' "$DIR/caption.txt" | head -n1)
              FRESH=1
              case "$USED" in *"|$TITLE|"*) FRESH=0 ;; esac
              if [ "$FRESH" = "0" ] && [ "$DISTINCT" -lt "$POOL" ] && [ "$ATTEMPT" -lt 8 ]; then
                echo "  $SLUG attempt $ATTEMPT: '$TITLE' already used, regenerating"
                continue
              fi
              if [ "$FRESH" = "1" ]; then USED="$USED|$TITLE|"; DISTINCT=$((DISTINCT+1)); fi
              mkdir -p "decks/$SLUG/$STAMP"
              cp "$DIR"/slide_*.jpg "$DIR/caption.txt" "decks/$SLUG/$STAMP/"
              echo "$SLUG -> $TITLE"
              break
            done
          done
          test -n "$(ls -A decks)"

      - name: Assemble the Pages site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r decks/* _site/
          cp -f site/tiktok*.txt _site/ 2>/dev/null || true
          echo '<!doctype html><title>slides</title>ok' > _site/index.html
          find _site -name 'slide_*.jpg' | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - uses: actions/upload-artifact@v4
        with:
          name: decks
          path: decks/**
          retention-days: 30

  post:
    needs: build
    runs-on: ubuntu-latest
    # Actions cannot index the secrets context by a name built at runtime, and
    # toJSON(secrets) -- the usual workaround -- makes GitHub refuse to start the
    # run at all (action_required, no jobs, no logs). So every account's token is
    # bound explicitly here and selected in bash by indirect expansion. A secret
    # that does not exist expands to "", which is exactly the "has this account
    # been authorised yet?" test. Adding an account means adding a line here.
    env:
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_REFRESH_TOKEN_AISTARTUPFOUNDER: ${{ secrets.TIKTOK_REFRESH_TOKEN_AISTARTUPFOUNDER }}
      TIKTOK_REFRESH_TOKEN_AITOOLS_GUY: ${{ secrets.TIKTOK_REFRESH_TOKEN_AITOOLS_GUY }}
      TIKTOK_REFRESH_TOKEN_STARTUPTOOLS101: ${{ secrets.TIKTOK_REFRESH_TOKEN_STARTUPTOOLS101 }}
      TIKTOK_REFRESH_TOKEN_TYLER_AI: ${{ secrets.TIKTOK_REFRESH_TOKEN_TYLER_AI }}
      TIKTOK_REFRESH_TOKEN_SOLOPRENEURTIPS: ${{ secrets.TIKTOK_REFRESH_TOKEN_SOLOPRENEURTIPS }}
      TIKTOK_REFRESH_TOKEN_STARTUPFOUNDERTIPS: ${{ secrets.TIKTOK_REFRESH_TOKEN_STARTUPFOUNDERTIPS }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        account: ${{ fromJSON(needs.build.outputs.accounts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: decks
          path: decks

      - name: Resolve this account's refresh token
        env:
          SLUG: ${{ matrix.account }}
          LEGACY: ${{ vars.TIKTOK_LEGACY_ACCOUNT }}
        run: |
          set -euo pipefail
          UPPER=$(echo "$SLUG" | tr '[:lower:]' '[:upper:]' | tr -c 'A-Z0-9_\n' '_')
          VAR="TIKTOK_REFRESH_TOKEN_${UPPER}"
          TOKEN="${!VAR:-}"
          if [ -z "$TOKEN" ] && [ "$SLUG" = "${LEGACY:-}" ]; then
            TOKEN="${TIKTOK_REFRESH_TOKEN:-}"
          fi
          if [ -z "$TOKEN" ]; then echo "::error::No refresh token for $SLUG"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "RESOLVED_TIKTOK_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Wait for this account's slides to be served
        env:
          BASE: ${{ vars.TIKTOK_SLIDES_BASE_URL }}
          SLUG: ${{ matrix.account }}
          STAMP: ${{ needs.build.outputs.stamp }}
        run: |
          set -euo pipefail
          URL="$BASE/$SLUG/$STAMP/slide_00.jpg"
          echo "Checking $URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ]; then echo "Slides are live."; exit 0; fi
            echo "  attempt $i: HTTP $CODE"; sleep 10
          done
          echo "::error::Slides never became reachable at $URL"; exit 1

      - name: Send to TikTok
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_SLIDES_BASE_URL: ${{ vars.TIKTOK_SLIDES_BASE_URL }}
          # step env beats the job-level legacy binding
          TIKTOK_REFRESH_TOKEN: ${{ env.RESOLVED_TIKTOK_TOKEN }}
        run: |
          python3 scripts/tiktok_draft.py \
            --run "decks/${{ matrix.account }}/${{ needs.build.outputs.stamp }}" \
            --base-url "${{ vars.TIKTOK_SLIDES_BASE_URL }}/${{ matrix.account }}" \
            ${{ inputs.direct && '--direct' || '' }}

name: Publish slideshow to TikTok

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      direct:
        description: 'Publish straight to the feed instead of a draft'
        required: false
        type: boolean
        default: false
      skip_generate:
        description: 'Reuse the newest existing run'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tiktok-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --upgrade Pillow
      - name: Refresh the title slide
        if: ${{ !inputs.skip_generate }}
        run: python3 scripts/refresh_title_slide.py
      - name: Generate slideshow
        if: ${{ !inputs.skip_generate }}
        env:
          WITH_SLIDEYS: '1'
        run: python3 scripts/make_slideshow.py
      - name: Pick the run folder
        id: pick
        run: |
          set -euo pipefail
          RUN="$(ls -1 runs | sort -r | head -n1)"
          if [ -z "$RUN" ] || [ ! -d "runs/$RUN" ]; then
            echo "::error::No run folder found"; exit 1
          fi
          echo "run_name=$RUN" >> "$GITHUB_OUTPUT"
          echo "Selected run: $RUN"
      - name: Assemble the Pages site
        run: |
          set -euo pipefail
          RUN="${{ steps.pick.outputs.run_name }}"
          mkdir -p _site/"$RUN"
          cp runs/"$RUN"/slide_*.jpg _site/"$RUN"/
          cp -f site/tiktok*.txt _site/ 2>/dev/null || true
          echo '<!doctype html><title>slides</title>ok' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Wait for the slides to be served
        env:
          BASE: ${{ vars.TIKTOK_SLIDES_BASE_URL }}
          RUN: ${{ steps.pick.outputs.run_name }}
        run: |
          set -euo pipefail
          URL="$BASE/$RUN/slide_00.jpg"
          echo "Checking $URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ]; then echo "Slides are live."; exit 0; fi
            echo "  attempt $i: HTTP $CODE"; sleep 10
          done
          echo "::error::Slides never became reachable at $URL"; exit 1
      - name: Send to TikTok
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_SLIDES_BASE_URL: ${{ vars.TIKTOK_SLIDES_BASE_URL }}
        run: |
          python3 scripts/tiktok_draft.py \
            --run "runs/${{ steps.pick.outputs.run_name }}" \
            ${{ inputs.direct && '--direct' || '' }}
      - name: Upload the run as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slideshow-${{ steps.pick.outputs.run_name }}
          path: runs/${{ steps.pick.outputs.run_name }}/**
          if-no-files-found: warn
          retention-days: 30
